[project]
name = "ywhob"
version = "0.1.0"
description = "축전 CCTV 혼잡도 측정 시스템"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "numpy>=1.26",
    "opencv-python>=4.9",
    "pyyaml>=6.0",
    "redis>=5.0",
]

[project.optional-dependencies]
# 추론(서비스)과 학습 모두 Ultralytics로 모델을 불러온다. YOLO26을 지원하는 버전 이상.
model = [
    "ultralytics>=8.4",
    "torch>=2.4",
    "torchvision>=0.19",
]
train = [
    "ultralytics>=8.4",
    "torch>=2.4",
    "torchvision>=0.19",
    "pillow>=10.0",
]

[project.scripts]
ywhob = "ywhob.main:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "fakeredis>=2.20",
]

# PyPI의 Windows용 torch는 CPU 전용이라 NVIDIA GPU(학습/추론)를 쓰려면 CUDA 빌드를 받는다.
[tool.uv.sources]
torch = [{ index = "pytorch-cu126", marker = "sys_platform != 'darwin'" }]
torchvision = [{ index = "pytorch-cu126", marker = "sys_platform != 'darwin'" }]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ywhob"]

[tool.pytest.ini_options]
testpaths = ["tests"]
