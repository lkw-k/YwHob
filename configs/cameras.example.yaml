# 카메라, 구역(ROI), 캘리브레이션 설정 예시 (spec 7.1).
# 이 파일을 configs/cameras.yaml로 복사해서 현장 값으로 채운다.
# cameras.yaml은 RTSP 계정이 들어갈 수 있어 git에 올리지 않는다.
#
# 좌표는 카메라 원본 해상도 기준 픽셀 좌표.
# url에는 RTSP 주소 외에 동영상 파일 경로도 넣을 수 있다 (재생 테스트용).

cameras:
  - id: cam01
    url: rtsp://user:password@192.168.0.10:554/stream1
    zones:
      - zone_id: hall_a_front
        roi: [[120, 400], [980, 400], [1260, 710], [20, 710]]
        capacity: 60          # 구역 면적(m²) × 기준 밀도 1.5명/m² (잠정)
      - zone_id: hall_a_back
        roi: [[300, 180], [900, 180], [980, 400], [120, 400]]
        capacity: 90
    matching:                 # spec 5.3 사람 확정 규칙. 카메라 각도에 따라 조정 (수정 예정)
      top_ratio: 0.4
      head_width_ratio: [0.15, 0.7]
    mask:                     # 최소 검출 크기 미만 영역 (spec 3.7). 발 위치가 여기 있으면 세지 않음
      - [[0, 0], [1280, 0], [1280, 180], [0, 180]]
